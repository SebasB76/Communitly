<!DOCTYPE html>
<html lang="es">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Catálogo de comunidades estudiantiles de la ESPOL: descubre, sigue y postula a las comunidades que te interesan.">
  <meta name="theme-color" content="#123B63">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ESPOL Communities">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ESPOL Communities</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /*
      Pantalla de carga. El bundle de Flutter web tarda unos segundos en
      descargarse y hasta que arranca la página queda completamente en blanco,
      que es indistinguible de una app rota. Este bloque se muestra desde el
      primer byte y lo borra el propio Flutter al pintar el primer fotograma.
    */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #f3f5f8;
    }

    @media (prefers-color-scheme: dark) {
      html, body { background-color: #131416; }
      #carga-inicial .carga-texto { color: #c9ccd1; }
    }

    #carga-inicial {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      transition: opacity 250ms ease-out;
    }

    #carga-inicial .carga-marca {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: #123b63;
    }

    @media (prefers-color-scheme: dark) {
      #carga-inicial .carga-marca { color: #9dc2ea; }
    }

    #carga-inicial .carga-texto {
      font-size: 13px;
      color: #5f6368;
    }

    #carga-inicial .carga-aro {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(18, 59, 99, 0.18);
      border-top-color: #123b63;
      border-radius: 50%;
      animation: girar 900ms linear infinite;
    }

    @media (prefers-color-scheme: dark) {
      #carga-inicial .carga-aro {
        border-color: rgba(157, 194, 234, 0.18);
        border-top-color: #9dc2ea;
      }
    }

    @keyframes girar { to { transform: rotate(360deg); } }

    /* Respeta a quien pidió menos animación en su sistema. */
    @media (prefers-reduced-motion: reduce) {
      #carga-inicial .carga-aro { animation-duration: 3s; }
    }
  </style>
</head>
<body>
  <div id="carga-inicial" role="status" aria-live="polite">
    <div class="carga-marca">ESPOL Communities</div>
    <div class="carga-aro"></div>
    <div class="carga-texto">Cargando la aplicación...</div>
  </div>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Flutter avisa cuando pintó el primer fotograma; recién ahí se retira la
    // pantalla de carga, para que no haya un parpadeo en blanco entre las dos.
    window.addEventListener('flutter-first-frame', function () {
      var carga = document.getElementById('carga-inicial');
      if (!carga) return;
      carga.style.opacity = '0';
      setTimeout(function () { carga.remove(); }, 250);
    });
  </script>
</body>
</html>
